name = "fundamental-groupoids"
version = "0.1.0"
defaultTargets = ["FundamentalGroupoids", "FundamentalGroupoidsTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "groupTheory"
git = "https://github.com/FormalFrontier/group-theory.git"
rev = "12ea07a60c5e6c219d8996eb56d7485139041e15"

[[lean_lib]]
name = "FundamentalGroupoids"

[[lean_lib]]
name = "FundamentalGroupoidsTest"

# Verification declarations are intentionally private.
[lean_lib.leanOptions]
weak.linter.privateModule = false
