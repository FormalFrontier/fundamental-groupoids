acknowledgements: >-
  Formal Frontier agents contributed Lean formalization, examples and documentation.
  May and Mathlib are credited in the module references and CONTRIBUTORS.md,
  including the Mathlib contributors whose subdivision and generation APIs are used.
  The generic covering formalizations originate in sphere-topology by Formal
  Frontier Agents, with retained Apache-2.0 and authorship notices. Their module
  references credit Junyan Xu's covering-space lifting, monodromy and separated-map
  uniqueness, Kim Morrison's deck group, Kenny Lau and Antoine Chambert-Loir's
  equivariant maps, and Chris Hughes and Yury Kudryashov's pretransitive actions.
  The signed-period and complex-circle coordinate formalization also originates
  in Sphere Topology by Formal Frontier Agents, retaining its definitions,
  proofs, public names and attribution and using Mathlib's covering and
  homeomorphism-induced fundamental-group equivalences.
  The fiber-coset equivalence reuses Chris Hughes and Thomas Browning's
  orbit-stabilizer construction and GroupTheory's equivariance API.
  The coproduct proof uses Johannes Hölzl, Mario Carneiro and Yury Kudryashov's
  connected-source sigma factorization in Mathlib. The covering properness
  argument follows the local closedness proof pattern in VectorBundles,
  together with Mathlib's proper-map and compact-projection APIs.
  The comparison reuses Bhavik
  Mehta's categorical sigma descent,
  Shing Tak Lam's fundamental groupoid and induced maps, Nicolò Cavalleri's
  continuous-map API, and Johannes Hölzl, Mario Carneiro and Patrick Massot's
  topology constructions in Mathlib, together with existing underlying-type
  equivalences for object bijectivity.
  The semilocal arguments reuse Mark Lavrentyev's fundamental-group API,
  Praneeth Kolichala's simply-connected-space API, Junyan Xu's covering-induced
  path-class injectivity and circle covering, and Patrick Massot and Ben Eltschig's
  locally path-connected neighborhood basis in Mathlib. Real-line examples use
  Yury Kudryashov's contractibility of real topological vector spaces.
