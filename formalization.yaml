alignment:
  note: >-
    Public mathematical interfaces; the source references describe motivation
    and generalizations. The arbitrary-family coproduct comparison equivalence
    is derived support for the all-points groupoid and disjoint-union viewpoint.
    The semilocal API is standalone supporting theory, not a claimed
    correspondence with a named theorem in May. Relative affine homotopies and
    vector-space homotopy quotients are supporting theory built on Mathlib,
    without a claimed correspondence with a named theorem in May. The based
    compact-open collapse comparison and its finite-cube specialization are
    supporting topology built on Mathlib and GroupTheory's compact-covering
    precomposition embedding API. The strict ordered finite-wedge comparisons
    and compatibility with the chosen opposite cartesian associator are
    consequences of the based coproduct universal properties and Mathlib's
    cartesian projection equations, without a claimed correspondence with a
    named theorem in May.
    The ordinary homotopy-fiber product comparison is a structural consequence
    of the retained-point model and Mathlib's compact-open API, without a
    claimed correspondence with a named theorem in May.
    The free-source-factor comparison is structural derived support, assembled
    from the existing canonical pullback provider and Mathlib's restricted
    associator and set-product homeomorphisms, not a theorem quoted from May.
    The loop-image formula adapts Chapter 8 §6 to ordinary homotopy fibers,
    retaining the whole forward loop at a specified source point. For the same
    loop-class composite delta, the preimage of {delta 1} is the image of
    FundamentalGroup.mapOfEq f h, where h identifies the chosen point's image
    with the basepoint. The representative law holds for every raw forward loop,
    and delta 1 is the component of the constant-path point. May's preceding
    arrow on p. 62 is minus Omega f, with the same group image; no group structure
    on the fiber's path components, surjectivity of delta or full long exact
    sequence is asserted. Source and base universes are independent and their
    topologies arbitrary. The component-image formula for arbitrary commuting
    squares over the identity base is a structural extension, not a statement
    quoted from May or an identification with his category. Projection exactness
    at HomotopyGroup N E e0 adapts the finite-dimensional projection position in
    Chapter 8 §6, printed pp. 61–62 (PDF pp. 69–70), especially printed p. 62;
    the arbitrary-index formula is a cubical extension. It is distinct from the
    adjacent positions at the fundamental group of B and the path components of
    the fiber. The finite-dimensional loop-inclusion formula adapts the same
    passage at the homotopy-fiber position; its arbitrary-index statement is a
    cubical extension. For f : C(E, B), b : B, e0 : E and h : f e0 = b, the
    source is the ordinary topological Path b b based at Path.refl b. The
    continuous composite through HomotopyFiber.constHomeomorph Unit b b and
    HomotopyFiber.map retains e0 and the whole forward loop, sending Path.refl b
    to HomotopyFiber.const e0 h; f need not be constant. Its image under mapFun
    for every N equals the retained-point map's preimage of the constant class,
    with no index instances. DecidableEq N and Nonempty N give the corresponding
    subgroup range–kernel formula for the existing map homomorphisms. The
    empty-index consequence uses all components of Path b b, not only the
    component of Path.refl b. Index and space universes are independent, with
    arbitrary topologies and no degree-shift comparison. The unpointed zeroth
    projection formula still permits empty E without e0 or h.
    Products, subspaces and compact-open spaces use ordinary,
    non-kified topologies; no sphere-domain comparison or identification with
    May's weak-Hausdorff, compactly generated category U is asserted.
