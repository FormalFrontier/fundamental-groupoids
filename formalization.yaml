# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: Fundamental Groupoids
  description: >-
    Endomorphism transport, chosen-vertex equivalences and connectedness of
    fundamental groupoids, with small-path generation and constructed strict
    descent along arbitrary indexed open covers into arbitrary categories.
    Based van Kampen for two-open covers with a common basepoint and
    path-connected opens and intersection, as a unique-homomorphism universal
    property and a pushout of groups. A path-connected based open core and
    charts with that common pairwise overlap give a colimit of their inclusion
    star when the core and charts cover the space. The raw group colimit is
    multiplicatively equivalent to the ambient fundamental group, preserving
    every leg in both directions with independent space and index universes.
    Inclusion-directed covers by neighborhoods
    of a supplied basepoint give colimits without path connectedness or
    intersection closure, with a universal property for arbitrary target monoids
    in independent universes. Monotone neighborhood covers indexed by directed
    preorders give the same universal property with compatibility only along
    index inequalities, and colimit data for the canonical preorder diagram.
    Signed-period additive-circle and complex-circle fundamental groups have
    integer coordinates, with signed-loop, inverse, endpoint, nonidentity and
    homeomorphism-compatibility laws, using Mathlib's quotient coverings.
    Continuous maps act functorially on path components, with equal actions for
    homotopic maps, in independent space universes without separation assumptions.
    Based postcomposition on generalized loops and homotopy quotients for every
    cube-index type, with positive homomorphisms, based-homotopy invariance and
    fundamental-group compatibility. Homotopy quotients commute with arbitrary
    dependent products for all cube indices in independent universes, by coordinate
    evaluation and loop assembly; for nonempty cube indices with decidable equality
    this is a multiplicative equivalence for the existing group structures.
    Raw cubical homotopy quotients canonically identify with path components of
    the same compact-open generalized-loop spaces, naturally in based postcomposition
    and compatibly with the empty-index comparison. For singleton index types,
    the generalized-loop space is homeomorphic to the compact-open based path
    space through Mathlib's singleton-coordinate equivalence, with full forward
    and inverse evaluation, constant/reflexive-path laws and based-postcomposition
    naturality. Index and space universes are independent, without separation or
    local compactness assumptions on the target. The based homotopy-fiber
    point projection has class image equal to the preimage of the constant class
    for every cube index, with range–kernel form for the existing positive groups. Equivalences of cube-index
    types induce quotient equivalences by reindexing representatives, with inverse,
    identity, composition and based-postcomposition laws in independent universes.
    For nonempty indices with decidable equality, the same maps are multiplicative
    for the existing group structures, without requiring corresponding selected axes.
    The continuous identity from Mathlib's CompHaus-test topology to the original
    target topology induces a natural equivalence on every cubical homotopy
    quotient, multiplicative for nonempty indices with decidable equality.
    Probe, cube-index and target universes are independent. Unchanged functions
    lift continuously from every universe-parameterized compactly generated source.
    Ordinary products preserve universe-parameterized compact generation when
    one factor is locally compact. For such a compactly generated factor P and
    any topological A, the refinement of P × A is homeomorphic to P times the
    refinement of A by the identity functions. Supplied relative homotopies from
    compactly generated sources lift with unchanged joint cylinder functions,
    endpoints and arbitrary fixed subsets, with counit inverse and naturality laws.
    Coverings induce canonical quotient-map injections for nonempty cube indices
    and bijections for nontrivial indices, without decidable equality.
    For nontrivial indices with decidable equality,
    the stock homotopy groups are multiplicatively equivalent, with forward
    postcomposition and inverse represented by a chosen based generalized-loop
    lift. Coordinate-face cube boundaries are path connected for nontrivial
    indices, including infinite ones. Finite cube boundaries are closed, including
    the empty-index case. For every index type, the boundary complement with its
    subtype topology is homeomorphic to the real product on that type; for finite
    indices it is locally compact. A Hausdorff space maps continuously to the
    one-point compactification of any open subspace by retaining that subspace
    and collapsing its complement to infinity, without a local compactness
    assumption. Adding a disjoint point gives a surjection, even for
    the whole space, and a quotient map when the ambient space is compact.
    For compact Hausdorff ambient spaces, collapse pullback is a homeomorphism
    between continuous maps based at infinity and ambient maps equal to the
    chosen point outside the open subspace, with ordinary compact-open/subtype
    topologies. Its finite-cube specialization identifies generalized loops
    with based maps from the one-point compactification of the cube-boundary
    complement, including empty indices and arbitrary topological targets in
    independent universes.
    Relative affine interpolation fixes any agreement subset for maps into real
    modules with continuous addition and scalar multiplication. Generalized loops
    in such modules are homotopic relative to the cube boundary to their constant
    loops, and all their homotopy quotients are subsingletons, including empty
    indices and arbitrary chosen points.
    Generic covering-map lifting and based
    equivalences, monodromy, equivariant fiber maps and deck-group centralizers.
    A covering map is proper exactly when every point fiber is finite,
    without separation, local compactness or uniform-degree assumptions.
    Fiber finiteness is locally constant, with clopen locus including empty
    fibers and excluding infinite ones. On a preconnected base, properness
    is equivalent to finiteness of the fiber at any given point. For preconnected
    total space and a supplied total-space point, finiteness of its fiber suffices
    without base connectedness or surjectivity. With path-connected total space,
    monodromy identifies the based fiber with left cosets of the induced image,
    and properness is equivalent to that subgroup having finite index.
    The canonical comparison from the categorical coproduct of fundamental
    groupoids to the fundamental groupoid of the topological coproduct is an
    equivalence, for arbitrary families without connectivity assumptions.
    Semilocal simple connectivity uses chosen-center loops contracting in the
    ambient space, with induced-map reflection, local-homeomorphism transport,
    covering consequences and a locally path-connected neighborhood refinement.
    Radial deformations of punctured closed and open balls onto spheres are
    available in arbitrary real normed spaces. Positive real scaling identifies
    Circle with each positive-radius complex sphere. Scaling and normalization
    give strict retractions and circle-fixing deformations of punctured balls.
    Ordered two-factor based wedges are strictly isomorphic to binary wedges,
    and both nested binary three-factor wedges flatten strictly to the finite
    wedge. Forward and inverse maps preserve the ordered factor inclusions and
    common point, for possibly different factors in an arbitrary common universe.
    In the named cartesian structure on the ordinary opposite based-homotopy
    category, the unop of the associator followed by left-nested flattening
    equals right-nested flattening after applying the quotient functor.
    Positive-radius inner circles classify punctured complex-ball fundamental
    groups by the integers, with normalization and scaling maps and a nontrivial
    positive generator.
    Compatible functions on a disk attachment descend uniquely to any target
    type, and continuous descent has the same underlying function.
    Removing the centres of an arbitrary family of attached closed complex unit
    disks gives a subspace that strongly deformation retracts onto the original
    space image, for arbitrary unbased circle maps and independent space and
    disk-index universes, without connectivity or separation assumptions.
    Commuting squares of source and target homeomorphisms induce homeomorphisms
    of ordinary compact-open homotopy fibers at corresponding specified points,
    with point, full-path, inverse, identity, composition and projection laws.
    Fibers of product maps are homeomorphic to products of ordinary homotopy
    fibers, preserving both retained source points and full same-time paths,
    naturally for arbitrary continuous squares in independent universes.
    A free source factor splits from the fiber of f composed with first projection:
    the result is HomotopyFiber f b times the free factor, retaining both source
    coordinates and the entire original path. Whole continuous-map diagrams,
    inverse and constructor laws and same-time evaluation hold for arbitrary
    topologies in three independent universes; arbitrary-square naturality with
    a continuous free-factor map uses six independent universes. For f equal to
    identity, the full identity-fiber factor remains.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Formal Frontier source maintainers
  license: Apache-2.0
highlights:
  - title: Based van Kampen for intersection-closed open covers
    statement: >-
      For an arbitrarily indexed, binary-intersection-closed open cover of X by
      path-connected neighborhoods of a common point x, homomorphisms from the
      local fundamental groups to any group, compatible along every inclusion,
      determine a unique homomorphism from π₁(X,x), and the inclusion cocone is
      a colimit in GrpCat at the space universe, with independent space, index
      and target-group universes.
    declarations:
      - declaration: FundamentalGroup.existsUnique_hom_of_isOpenCover_of_infClosed
        file: FundamentalGroupoids/AlgebraicTopology/FundamentalGroup/OpenCover.lean
      - declaration: FundamentalGroup.isColimitOfIsOpenCover
        file: FundamentalGroupoids/AlgebraicTopology/FundamentalGroup/OpenCover.lean
  - title: The fundamental group of the circle is ℤ
    statement: >-
      The complex unit circle has π₁(Circle,1) ≃* Multiplicative ℤ with its
      counterclockwise generator sent to +1, while for every nonzero real period
      T the equivalence π₁(AddCircle T,0) ≃* Multiplicative ℤ sends the projected
      real segment from 0 to Tn to n for every integer n.
    declarations:
      - declaration: Circle.fundamentalGroupEquivInt
        file: FundamentalGroupoids/AlgebraicTopology/FundamentalGroup/Circle.lean
      - declaration: Circle.fundamentalGroupEquivInt_loop
        file: FundamentalGroupoids/AlgebraicTopology/FundamentalGroup/Circle.lean
      - declaration: AddCircle.fundamentalGroupEquivInt
        file: FundamentalGroupoids/AlgebraicTopology/FundamentalGroup/Circle.lean
      - declaration: AddCircle.fundamentalGroupEquivInt_loop
        file: FundamentalGroupoids/AlgebraicTopology/FundamentalGroup/Circle.lean
  - title: Covering fibers, cosets and properness
    statement: >-
      A covering p : E → B between arbitrary topological spaces in independent
      universes is proper exactly when every point fiber is finite, and when E
      is path connected with chosen e₀, monodromy identifies the fiber over
      p(e₀) with the left cosets of im(π₁(E,e₀) → π₁(B,p(e₀))) and properness
      is equivalent to finite index of that image subgroup.
    declarations:
      - declaration: IsCoveringMap.isProperMap_iff_finite_fibers
        file: FundamentalGroupoids/Topology/Covering/Proper.lean
      - declaration: IsCoveringMap.monodromyQuotientEquiv
        file: FundamentalGroupoids/Topology/Covering/Monodromy.lean
      - declaration: IsCoveringMap.isProperMap_iff_finiteIndex
        file: FundamentalGroupoids/Topology/Covering/FiniteIndex.lean
  - title: Covering maps on positive cubical homotopy groups
    statement: >-
      Given a covering p : E → B and e : E, postcomposition on homotopy classes
      of N-cubes relative to their coordinate-face boundary is injective for
      nonempty N and bijective when N has at least two elements, with independent
      cube and space universes and, in the latter case with decidable equality
      on N, a multiplicative equivalence HomotopyGroup N E e ≃*
      HomotopyGroup N B (p e) for the existing group structures.
    declarations:
      - declaration: IsCoveringMap.injective_homotopyGroup_mapFun
        file: FundamentalGroupoids/Topology/Covering/HomotopyGroup.lean
      - declaration: IsCoveringMap.bijective_homotopyGroup_mapFun
        file: FundamentalGroupoids/Topology/Covering/HomotopyGroup.lean
      - declaration: IsCoveringMap.homotopyGroupMulEquiv
        file: FundamentalGroupoids/Topology/Covering/HomotopyGroup.lean
sources:
  - title: A Concise Course in Algebraic Topology
    authors:
      - J. Peter May
    id: https://www.math.uchicago.edu/~may/CONCISE/ConciseRevised.pdf
    type: book
    location: >-
      Revised author PDF, Chapter 1 §§3, 5, 7 and Chapter 2 §§4–5, 7–8.
      Chapter 3 §§2–4, 7 for covering-space monodromy, lifting and maps of covers.
      Chapter 5 §§1–2, printed pp. 39–41, for compact-Hausdorff tests and kification.
      Chapter 8 §6, “Fiber sequences”, printed pp. 61–62 (PDF pp. 69–70),
      especially printed p. 62, for loop-image and projection exactness.
      Chapter 9 §§1, 4, printed pp. 65–67, for based homotopy groups and the
      classical finite-degree covering isomorphism.
    relationship: adapts
    note: >-
      The book is published by the University of Chicago Press. Basepoint
      change, chosen-vertex equivalence and the groupoid colimit
      argument motivate the results. Transport is stated categorically and
      descent permits arbitrary indexed open covers and arbitrary target
      categories, beyond the connectedness and intersection conditions in
      the source's diagram. The directed-preorder formulation generalizes the
      finite-stage colimit step in Chapter 2 §7, printed p. 19 (PDF p. 27);
      it does not identify all finite families with the source's restricted
      finite intersection-closed families or assert the later comparisons.
      Circle coordinates use the positive loop and lifted-endpoint description
      of Chapter 1 §5; the additive-circle API generalizes it to nonzero signed
      real periods. The private integer power-map consumer uses the same public
      signed-loop normal form, including zero and negative exponents, as in §7.
      The covering modules use the based lifting,
      monodromy and over-base comparison arguments, with the asymmetric
      connectivity and local path connectedness hypotheses stated below.
      The based fundamental-group functor preserves every existing indexed
      product, with independent index and space universes. This categorically
      generalizes the binary product lemma in Chapter 2 §8; it does not assert
      existence of every large product in a fixed universe.
      The coproduct comparison is derived support for the all-points groupoid
      and disjoint-union viewpoint of Chapter 2 §§5–6, not a named theorem
      quoted from the book. The fiber-finiteness, properness and finite-index
      bridge are supporting covering theory, not theorems quoted from the book.
      Semilocal simple connectivity and its transport/refinement API are
      supporting theory, not a claimed correspondence with a named book result.
      The covering homotopy-group equivalence specializes in finite degrees
      at least two to the classical result on printed p. 66. Arbitrary index
      types give a derived cubical, coordinate-face-boundary-relative extension,
      without a comparison with sphere-domain or U-topology homotopy groups.
      The topology comparison uses Mathlib's CompHaus-test construction without
      a target separation hypothesis. May's compactly generated spaces include
      weak Hausdorffness; no identification with that category is asserted.
      All-index cubical comparisons extend the finite-degree motivation, without
      a sphere-domain comparison or an arbitrary-product formula for kification.
      The locally compact factor comparison is supporting topology derived using
      Mathlib's quotient-product continuity theorem.
      No open redistribution license is inferred for
      the author-hosted PDF, and no book excerpts or PDF assets are included.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Uses the canonical endomorphism, conjugation, one-object category,
      connectedness, fundamental-groupoid, subdivision, open-cover,
      morphism-property, pairwise-diagram and colimit APIs, together with
      covering maps, lifting, monodromy, deck groups and equivariant maps,
      as well as cardinality, local constancy, proper maps, compact projections
      and local closedness, with the orbit-stabilizer equivalence, ordinary
      left-coset quotients and subgroup finite-index API. Semilocal results use
      path-homotopy quotients, subgroup ranges, local-homeomorphism charts,
      covering-induced path-class injectivity and open path-connected
      neighborhood bases. Homotopy-group maps use the existing generalized loops,
      relative homotopies, homotopy quotient, canonical positive group structures,
      and the multiplicative comparison with the fundamental group. Relative
      affine interpolation reuses the affine homotopy and straight segment paths;
      the vector-space quotient results use the boundary-relative homotopy relation
      and its existing quotient. Based
      generalized-loop lifts use unique continuous lifting from the contractible,
      locally path-connected cube and path connectedness of its coordinate-face
      boundary, together with discreteness of the covering fiber. The based
      compact-open comparisons use OnePoint and its recursor, compact-open
      mapping spaces and continuity of precomposition.
  - id: https://github.com/FormalFrontier/group-theory
    relationship: builds-on
    note: >-
      The based compact-open collapse comparison uses
      ContinuousMap.isEmbedding_precomp_of_compactCovering from
      GroupTheory.Topology.ContinuousMap.CompactCovering for compact-open
      continuity of the inverse family. The finite-cube
      generalized-loop comparison specializes this open-subspace homeomorphism.
  - id: https://github.com/FormalFrontier/restricted-product-duality
    relationship: builds-on
    note: >-
      The generic based-postcomposition definitions and proofs in
      RestrictedProductDuality.HomotopyMaps originate with Formal Frontier Agents.
      They supply FundamentalGroupoids.Topology.Homotopy.HomotopyGroup.Map,
      retaining the same names, statements, proofs, Apache-2.0 and authorship
      notices. Its generic path-component map and four characteristic laws also
      supply FundamentalGroupoids.Topology.Connected.PathConnected, with names
      under ZerothHomotopy and retained proofs, pointwise identity/composition
      statements and notices. Both modules depend only on Mathlib.
  - id: https://github.com/FormalFrontier/vector-bundles
    relationship: builds-on
    note: >-
      Follows the local closedness and compact-fiber proof pattern for proper
      bundle projections in VectorBundles.Topology.FiberBundle.Proper.
      This is proof-pattern reuse, not a package dependency or a replacement
      of a given covering map by a fixed-model bundle projection.
  - id: https://github.com/FormalFrontier/sphere-topology
    relationship: builds-on
    note: >-
      The generic covering formalizations originate in sphere-topology by
      Formal Frontier Agents. The modules CoveringLifting, CoveringEquivalence,
      CoveringMonodromy, DeckGroup and DeckMonodromy supply the covering APIs
      now under FundamentalGroupoids.Topology.Covering, with the same
      declaration names and retained Apache-2.0 and authorship notices.
      Its point-chart star comparison also supplies the universal-property
      proof pattern generalized here to based common-overlap open covers in
      arbitrary ambient spaces, without a package dependency on Sphere Topology.
      Its signed-period and complex-circle coordinate definitions and proofs in
      SphereTopology.Homotopy.Circle also supply the Fundamental Groupoids
      circle module, with the same public names and characteristic API.
automation:
  methods:
    - method: agent
      framework: Formal Frontier agents and Lean 4
      tool_setup: AI-assisted Lean formalization and mathematical documentation.
status:
  scope: >-
    Set-level descent uses arbitrary target types and agrees with continuous
    descent whenever the presenting maps are continuous.
    Disk centres form a closed set, and compatible functions or continuous maps
    descend from the original space and punctured disks to its complement.
    The normalized-direction retraction is a strict left inverse to the
    original-space map. The radial homotopy fixes its image throughout.
    In an arbitrary category, equality of isomorphism-induced endomorphism
    transports is characterized by centrality of the relative loop.
    In a groupoid, independence from every isomorphism to a fixed explicitly
    isomorphic target characterizes commutativity. A chosen vertex functor is
    full and faithful in any category and an equivalence in a preconnected
    groupoid. Path connectedness agrees with connectedness of the fundamental
    groupoid, including nonemptiness. Small-path generation needs only
    composition stability, and local naturality extends to a unique natural
    transformation. Strictly compatible chart functors descend uniquely by
    equality; characteristic object and morphism equations include equality
    transport. Space, index, target-object and target-hom universes are
    independent. Inclusion cocones are colimits in Grpd and Cat at their
    fixed bundled sizes. No connectedness, inhabited intersections,
    nonempty target or faithful inclusion is required for descent.
    For X : Type u, two opens U and V with U ⊔ V = ⊤, set path connectedness
    of U, V and their intersection, and a common point p, compatible
    homomorphisms from the two based fundamental groups into any G : Type v
    with Group G extend uniquely to the fundamental group of X at p.
    The extension satisfies both inclusion-composition equations; u and v are
    independent. The same four inclusion homomorphisms form an IsPushout
    square in GrpCat.{u}. These are two-open specializations of the based-group
    colimit theorem, obtained using strict groupoid descent. Neither global
    path connectedness nor local path connectedness is an extra hypothesis.
    For a based open core C contained in every chart U i, assume path
    connectedness of C and the charts, U i intersect U j equals C at distinct
    indices, and coverage by C together with all charts. Their core-to-chart
    star inclusion cocone is a colimit in GrpCat at the ambient group universe.
    Its raw quotient group is canonically multiplicatively equivalent to the
    ambient fundamental group, preserving every core and chart leg in both
    directions. Space and index universes are independent; the raw quotient
    lies in their maximum. Empty chart families and nontrivial core groups are
    allowed. This is a common-core re-presentation of the based all-inclusions
    cover theorem, not an arbitrary-cover based theorem or wedge calculation.
    For an inclusion-directed open cover by neighborhoods of a supplied basepoint,
    compatible homomorphisms from local fundamental groups into any monoid extend
    uniquely to the ambient fundamental group. Space, index and target universes
    are independent. The existing inclusion cocone is a colimit in GrpCat.{u};
    repeated indices are retained, with no path connectedness, intersection closure,
    separation, local connectivity, finiteness or separate index nonemptiness premise.
    This version uses every inclusion between presented neighborhoods and the
    diagram inducedFunctor U ⋙ openNhdsFunctor p. For arbitrary topological
    X : Type u, a supplied p : X, J : Type v with Preorder J and IsDirectedOrder J,
    and a monotone open-neighborhood cover U with hU : Monotone U, compatibility
    only along i ≤ j suffices. Homomorphisms into any G : Type w with Monoid G
    extend uniquely along the canonical inclusion legs, with u, v and w independent.
    The noncomputable definition isColimitOfIsOpenCoverOfMonotone returns
    IsColimit ((openNhdsCocone p).whisker hU.functor) in GrpCat.{u} for the
    canonical preorder category on J, not the induced all-inclusions category.
    No path connectedness, intersection closure, separation, local connectivity,
    smallness, injectivity, order reflection or separate Nonempty J premise is
    required; the cover at p supplies an index. These forms generalize the compact
    finite-stage colimit step in May, Chapter 2, §7, printed p. 19 (PDF p. 27).
    No arbitrary-cover based-group theorem, wedge calculation or
    covering-space classification is asserted.
    For D : Fin 2 → BasedTopCat in an arbitrary common universe, the explicit
    basedWedgeFinTwoIso sends factor 0 to the left and factor 1 to the right.
    For D : Fin 3 → BasedTopCat, basedWedgeFinThreeLeftIso and
    basedWedgeFinThreeRightIso flatten the respective nested binary wedges
    to basedWedge D, with ordered leaves 0, 1, 2. The inverse maps have the
    corresponding inclusion equations, and both directions preserve the
    common point. These are strict isomorphisms of based spaces, with no
    separation, connectedness, local compactness or basepoint condition.
    Their images under homotopyQuotient.mapIso use the existing quotient functor.
    For the named homotopyOppositeCartesianMonoidalCategory, the theorem
    homotopyOpposite_associator_unop_comp_finThreeLeft identifies the unop of
    its associator followed by homotopyQuotient.map of left-nested flattening
    with homotopyQuotient.map of right-nested flattening. It holds for every
    D : Fin 3 → BasedTopCat in an arbitrary common universe, retaining leaf
    order 0, 1, 2 and allowing different factors without additional hypotheses.
    For continuous f and g in a commuting square with coordinate homeomorphisms
    eX and eY, HomotopyFiber.homeomorph eX eY w hy compares the ordinary
    product/subspace fibers over any y and y' with hy : eY y = y'. The forward
    function maps the retained point by eX and postcomposes the whole compact-open
    path by eY; the inverse uses their inverses. All four space universes and
    topologies are independent, without embedding, separation, compact-generation
    or nonemptiness hypotheses. The identity, inverse, composition and
    point-projection laws use the existing homotopy-fiber map API.
    The fundamental-group functor on based spaces preserves every existing
    indexed product, including the empty product, without index-smallness or
    connectedness. Space and index universes are independent. The stock product
    comparison has the projection-induced coordinate maps; under the canonical
    based-product identification its coordinate homomorphism is piMulEquiv.
    The raw realization lives in the larger ambient universe when necessary,
    separately from the unrestricted preservation statement.
    For every nonzero real period T, the fundamental group of AddCircle T at
    zero is multiplicatively equivalent to Multiplicative ℤ, sending the loop
    lifted from zero to T * n to n for all integers. The complex-circle coordinate
    at one is transported through the period-one homeomorphism and sends the
    counterclockwise full turn to positive one. Inverse-loop, lifted-endpoint,
    nonidentity and signed-period homeomorphism-compatibility laws are public.
    At zero period all prescribed loops are constant; no integer equivalence
    is asserted there. The coordinate module depends only on Mathlib.
    For arbitrary topological spaces in independent universes, supplied points
    x and y and a continuous map f with f x = y, GenLoop.map postcomposes based
    cube maps and HomotopyGroup.mapFun acts on the existing homotopy quotient
    for any cube-index type N in an independent universe, including an empty one.
    Representative, constant, identity, composition and homotopy-relative-to-{x}
    laws require no decidable equality or nonemptiness of N. With DecidableEq N
    and Nonempty N, HomotopyGroup.map is a homomorphism for the canonical group
    structures and has mapFun as its underlying function. It preserves Mathlib's
    reversed concatenation convention. Under pi1MulEquivFundamentalGroup the
    dimension-one action agrees with FundamentalGroup.mapOfEq. No separation,
    connectedness, local path connectedness, finiteness or well-pointedness is
    assumed. The module depends only on Mathlib and supplies no group structure
    for empty indices. The separate path-component module defines ZerothHomotopy.map
    on the existing quotient by Joined for arbitrary continuous maps, with
    representative, pointwise identity/composition and homotopy-invariance laws.
    Space universes are independent, with no separation or connectedness assumptions.
    For f : C(E, B), e0 : E, b : B and h : f e0 = b, base the ordinary homotopy
    fiber at HomotopyFiber.const e0 h. For every cube index N, the point-projection
    mapFun has range equal to the preimage of the constant class under mapFun N f h.
    No index instances are needed. With exactly DecidableEq N and Nonempty N,
    the existing map homomorphisms give range equal to kernel; these instances
    supply operation data, not geometric hypotheses. Index, source and base
    universes are independent, and all topologies arbitrary. Empty-index classes
    retain all path components; the zeroth projection theorem also allows empty E
    without e0 or h. Infinite-index quotients are already subsingletons.
    For an arbitrary topological space X and chosen x, the continuous identity
    from compactlyGenerated.{u} X to the original topology gives
    HomotopyGroup.compactlyGeneratedEquiv for every cube-index type N.
    Its forward function is the existing mapFun, and with DecidableEq N and
    Nonempty N the same map is a multiplicative equivalence for the existing
    groups. Both comparisons are natural in based continuous maps. Probe,
    cube-index and target universes are independent, with no target separation
    or compact-generation assumption. Finite raw cubes and joint cylinders use
    source compact-generation; infinite quotients use the existing subsingleton
    theorem. Empty-index quotients retain all path components. The supporting
    continuity iff and unchanged-function lift apply to any
    UCompactlyGeneratedSpace.{u} source. The ordinary product of two such spaces
    is again u-compactly generated when the first factor is locally compact.
    For a locally compact u-compactly generated P and arbitrary topological A,
    Homeomorph.compactlyGeneratedProd identifies k_u (P × A) with P × k_u A by
    identity functions, with the counit square. Probe and both space universes
    are independent, with no separation or smallness assumptions. For any
    u-compactly generated A, ContinuousMap.HomotopyRel.toCompactlyGenerated lifts
    each supplied relative homotopy to the refined target with the same joint
    cylinder function, endpoints and arbitrary fixed subset. Counit postcomposition
    is inverse in both directions; lifting is natural under target maps and gives
    the corresponding homotopy-existence equivalence. Source, target and probe
    universes are independent, with no target separation or compact-generation
    premise and no local compactness or first-countability premise on A. Neither
    a sphere-domain comparison, May's weak-Hausdorff category nor an arbitrary
    product formula is supplied.
    For compact Hausdorff K : Type u, any open s and any topological X : Type v
    with a chosen x : X, OnePoint.collapsePullbackHomeomorph s x identifies
    {F : C(OnePoint s, X) // F ∞ = x} with
    {f : C(K, X) // ∀ k, k ∉ s → f k = x} homeomorphically. Both sides have
    the ordinary compact-open/subtype topology. The forward map is
    precomposition by OnePoint.collapse s; the inverse is OnePoint.rec x
    applied to the restriction to s. Ambient and target universes are independent,
    with no target separation or local compactness assumption. The open subspace
    may be empty or all of K; neither nonemptiness nor properness is required.
    For N in an independent universe with Finite N, GenLoop.onePointHomeomorph N x
    identifies GenLoop N X x homeomorphically with
    {F : C(OnePoint ((Cube.boundary N)ᶜ : Set (I^N)), X) // F ∞ = x}.
    Its forward map retains loop values on the coordinate-face boundary complement
    and assigns x at infinity; its inverse precomposes with the cube-boundary
    collapse. The topology is the ordinary compact-open/subtype topology, not a
    refinement of it. Only a topology and chosen point are required on X, with
    no Fintype, DecidableEq N or Nonempty N premise. When N is empty, the cube
    is a singleton and its boundary is empty, but infinity remains distinct from
    the cube point; the based-map space need not be a singleton. Five
    underlying-map and evaluation laws for each homeomorphism characterize both
    directions, including values at infinity and points of the open subspace.
    The constructions use GroupTheory's compact-covering precomposition
    embedding API.
    For an arbitrary topological domain A and a real module E with AddCommGroup E,
    Module ℝ E, TopologicalSpace E, ContinuousAdd E and ContinuousSMul ℝ E,
    ContinuousMap.HomotopyRel.affine f g hfg constructs an affine homotopy fixed
    on any subset S where the continuous maps f and g agree. Domain and target
    universes are independent. Its evaluation is AffineMap.lineMap, and the
    underlying-homotopy equation compares it with ContinuousMap.Homotopy.affine
    under IsTopologicalAddGroup E. Continuous negation follows from scalar
    multiplication by negative one. No separation, norm, completeness or local
    convexity of E, and no closedness or nonemptiness of S, are assumed. For every
    N in an independent universe and every x in E, GenLoop.homotopic_const
    contracts each generalized loop to the constant loop relative to Cube.boundary N
    using this construction and GenLoop.boundary. HomotopyGroup.subsingleton N x identifies
    all classes in the existing boundary-relative homotopy quotient by passing
    through the constant loop. Neither result requires decidable equality,
    finiteness or nonemptiness of N, and no global subsingleton instance is
    registered. At empty indices the boundary condition is empty, but affine
    interpolation still joins any cube value to x. No group structure on the
    empty-index quotient is supplied.
    For every real normed space E and positive radius r,
    Metric.puncturedClosedBallRetraction projects the punctured metric closed
    ball radially onto Metric.sphere (0 : E) r. Its composite with
    Metric.sphereToPuncturedClosedBall is the identity on the sphere.
    Metric.puncturedClosedBallDeformation is a ContinuousMap.HomotopyRel from
    the identity to inclusion after projection, fixing the sphere throughout.
    Metric.puncturedClosedBallHomotopyEquivSphere packages the projection and
    inclusion as a homotopy equivalence. Evaluation, endpoint and boundary laws
    describe the maps without unfolding them. No nontriviality, completeness,
    finite-dimensionality or inhabitance assumption is required.
    For 0 < a < r, Metric.sphereToPuncturedBall includes the radius-a sphere
    into the punctured open radius-r ball, and Metric.puncturedBallDeformation
    strongly deforms that ball onto the inclusion range. The associated
    Metric.puncturedBallHomotopyEquivSphere has radial projection forward
    and inclusion inverse. Metric.puncturedBallRetraction itself needs only
    0 < a, without requiring a < r. These constructions allow the zero space.
    In the complex plane, Complex.circleHomeomorphSphere identifies Circle
    with every positive-radius sphere by real scaling. The continuous maps
    Complex.circleToPuncturedBall and Complex.puncturedBallToCircle give
    scaling and normalization, with normalization z / ‖z‖ and a left-inverse
    law. For 0 < a < r, at the scaled image of 1 : Circle,
    Complex.puncturedBallFundamentalGroupEquivInt is a multiplicative
    equivalence with Multiplicative ℤ. Its forward homomorphism normalizes
    before taking the circle index; its inverse scales circle classes.
    Every scaled Circle.loop n has index n. The positive class is nontrivial
    and has index one, including for a = 1/2 and r = 1.
    For IsCoveringMap f and a supplied e : E, the same canonical mapFun with
    target point f e is injective for Nonempty N and bijective for Nontrivial N,
    without DecidableEq N. With DecidableEq N and Nontrivial N,
    homotopyGroupMulEquiv is a multiplicative equivalence for the stock group
    structures, whose forward homomorphism is HomotopyGroup.map. Its forward
    representative formula is GenLoop.map; its inverse sends a representative
    class to the class of liftGenLoop. The generic inverse formula also applies
    to any displayed based lift with the required GenLoop.map equality.
    The chosen lift exists uniquely for Nontrivial N, projects to the given
    generalized loop, takes zero to e, and returns any based loop when applied
    to its image. Cube.zero_mem_boundary requires only Nonempty N, while
    Cube.isPathConnected_boundary and the boundary subtype's path-connected
    instance require Nontrivial N. Index, total and base universes are independent;
    no connectedness, local path connectedness or separation of either space,
    global surjectivity, finiteness of the cube index or smallness is assumed.
    No injectivity for empty indices or surjectivity for singleton indices is
    asserted. For Fin n the covering equivalence applies when n is at least two;
    arbitrary indices use the coordinate-face boundary, not a topological frontier
    or a comparison with sphere-domain or U-topology homotopy groups.
    For a continuous map with path-connected, locally path-connected domain
    and a prescribed lift of its basepoint, unique based lifting is equivalent
    to containment of fundamental-group images, compared by the basepoint
    equality. Equal based images for two covers of a fixed base give a
    homeomorphism over that base when both total spaces are path connected
    and the source is locally path connected; no base connectedness or global
    surjectivity is required for these results.
    For a covering map p between arbitrary topological spaces in independent
    universes, IsProperMap p is equivalent to finiteness of every canonical
    point-fiber subtype. No separation, local compactness, connectedness,
    surjectivity, nonempty fiber or uniform-degree assumption is required.
    The predicate of canonical fiber finiteness is locally constant and its
    locus is clopen, including empty fibers and excluding infinite ones.
    On a preconnected base, properness is equivalent to finiteness at a
    given point; no additional nonemptiness premise is required.
    On a preconnected total space with a supplied point, properness is equivalent
    to finiteness over its image, without base connectedness or surjectivity.
    If the total space is path connected, the ordinary fiber is equivariantly
    equivalent to left cosets of the canonical based fundamental-group image;
    the coset of g maps to monodromy by g. The image need not be normal, and
    the group and fiber may lie in independent universes. Properness is then
    equivalent to finite index of that exact image subgroup.
    Compact inverse images then use Mathlib's existing proper-map API.
    Monodromy fixes a fiber point exactly on its based total-space
    fundamental-group image, and two fiber points share an orbit exactly when
    joined by a path, without connectivity or local path connectedness.
    Over a path-connected base, the total space is path connected exactly
    when it is nonempty and monodromy is pretransitive.
    Continuous over-maps restrict to equivariant fiber maps without connectivity
    hypotheses. Restriction is an equivalence of map spaces for path-connected
    base and locally path-connected source, including empty or disconnected
    source; alternatively, a path-connected, locally path-connected source and
    a supplied point suffice without base connectedness. Neither comparison
    requires connectivity or local path connectedness of the target, and
    individual fiber maps need not be bijective.
    The deck group acts on every point fiber. For a separated, locally
    injective map with preconnected total space, evaluation at a supplied point
    is injective. No codomain topology is needed, and surjectivity of evaluation
    is not asserted. Deck restriction to a chosen fiber is a homomorphism into the monodromy
    centralizer in that fiber's permutation group. It is injective over a
    path-connected base, without local path connectedness, and a multiplicative
    equivalence if the total space is also locally path connected, allowing
    empty or disconnected total spaces. The occupied-fiber equivalence instead
    needs path-connected, locally path-connected total space and a supplied
    point, without base connectedness. A point stabilizer is not generally
    the monodromy permutation kernel, and the centralizer is not a group
    structure on the fiber.
    For arbitrary independent universes, the canonical functor from the stock
    categorical sigma of the original fundamental groupoids to the fundamental
    groupoid of the original topological sigma is constructed by Sigma.desc
    of the inclusion-induced maps. Object and component-arrow equations,
    the restriction natural isomorphism and carrier-level object bijectivity
    are proved. No connectedness, nonemptiness, local path connectedness,
    finiteness, separation, compact-generation or basepoint assumptions are
    imposed on the summands. The ordinary theorem sigmaComparison_isEquivalence
    follows from full faithfulness on the original path-homotopy quotients and
    object surjectivity. Mathlib's connected-source sigma factorization applies
    to the interval and its square, with endpoint and relative-boundary equations
    recovered using injectivity of the summand inclusion. The theorem is not
    registered as an instance; Mathlib's Functor.asEquivalence supplies equivalence
    data after installing it locally. No coproduct naturality theorem is asserted.
    Semilocal simple connectivity at x means that x has an open neighborhood
    whose loops based at x are nullhomotopic in the ambient space, not necessarily
    in that neighborhood. The global Prop class quantifies separately over all
    centers, including vacuously on an empty space. It is equivalent to an open
    neighborhood inclusion having trivial based fundamental-group image, without
    connectedness of that neighborhood. Simply connected spaces satisfy it
    without local path connectedness. A continuous map reflects the pointwise
    property when its induced based fundamental-group homomorphism is injective;
    injectivity of the underlying map is not assumed. Local homeomorphisms
    preserve the pointwise property. A covering derives the required induced-map
    injectivity, giving pointwise equivalence and base-to-total global transport
    without surjectivity; global descent and global equivalence need surjectivity.
    Surjective local homeomorphisms also descend the global property.
    Under local path connectedness only, the chosen neighborhood can be open
    and path connected, with ambient nullhomotopies for loops at every basepoint
    in that one neighborhood. Intrinsic simple connectivity is not asserted.
    Source and target universes are independent; no separation, base path
    connectedness, extra nonemptiness or smallness assumption is imposed.
