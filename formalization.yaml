# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"
project:
  name: Fundamental Groupoids
  description: >-
    Endomorphism transport, chosen-vertex equivalences and connectedness of
    fundamental groupoids, with small-path generation and constructed strict
    descent along arbitrary indexed open covers into arbitrary categories.
    Based van Kampen for two-open covers with a common basepoint and
    path-connected opens and intersection, as a unique-homomorphism universal
    property and a pushout of groups. Inclusion-directed covers by neighborhoods
    of a supplied basepoint give colimits without path connectedness or
    intersection closure, with a universal property for arbitrary target monoids
    in independent universes. Monotone neighborhood covers indexed by directed
    preorders give the same universal property with compatibility only along
    index inequalities, and colimit data for the canonical preorder diagram.
    Signed-period additive-circle and complex-circle fundamental groups have
    integer coordinates, with signed-loop, inverse, endpoint, nonidentity and
    homeomorphism-compatibility laws, using Mathlib's quotient coverings.
    Generic covering-map lifting and based
    equivalences, monodromy, equivariant fiber maps and deck-group centralizers.
    A covering map is proper exactly when every point fiber is finite,
    without separation, local compactness or uniform-degree assumptions.
    Fiber finiteness is locally constant, with clopen locus including empty
    fibers and excluding infinite ones. On a preconnected base, properness
    is equivalent to finiteness of the fiber at any given point. For preconnected
    total space and a supplied total-space point, finiteness of its fiber suffices
    without base connectedness or surjectivity. With path-connected total space,
    monodromy identifies the based fiber with left cosets of the induced image,
    and properness is equivalent to that subgroup having finite index.
    The canonical comparison from the categorical coproduct of fundamental
    groupoids to the fundamental groupoid of the topological coproduct is an
    equivalence, for arbitrary families without connectivity assumptions.
    Semilocal simple connectivity uses chosen-center loops contracting in the
    ambient space, with induced-map reflection, local-homeomorphism transport,
    covering consequences and a locally path-connected neighborhood refinement.
  authors:
    - Formal Frontier Agents
  responsible_maintainers:
    - Formal Frontier source maintainers
  license: Apache-2.0
sources:
  - title: A Concise Course in Algebraic Topology
    authors:
      - J. Peter May
    id: https://www.math.uchicago.edu/~may/CONCISE/ConciseRevised.pdf
    type: book
    location: >-
      Revised author PDF, Chapter 1 §§3, 5, 7 and Chapter 2 §§4–5, 7–8.
      Chapter 3 §§2–4, 7 for covering-space monodromy, lifting and maps of covers.
    relationship: adapts
    note: >-
      The book is published by the University of Chicago Press. Basepoint
      change, chosen-vertex equivalence and the groupoid colimit
      argument motivate the results. Transport is stated categorically and
      descent permits arbitrary indexed open covers and arbitrary target
      categories, beyond the connectedness and intersection conditions in
      the source's diagram. The directed-preorder formulation generalizes the
      finite-stage colimit step in Chapter 2 §7, printed p. 19 (PDF p. 27);
      it does not identify all finite families with the source's restricted
      finite intersection-closed families or assert the later comparisons.
      Circle coordinates use the positive loop and lifted-endpoint description
      of Chapter 1 §5; the additive-circle API generalizes it to nonzero signed
      real periods. The private integer power-map consumer uses the same public
      signed-loop normal form, including zero and negative exponents, as in §7.
      The covering modules use the based lifting,
      monodromy and over-base comparison arguments, with the asymmetric
      connectivity and local path connectedness hypotheses stated below.
      The based fundamental-group functor preserves every existing indexed
      product, with independent index and space universes. This categorically
      generalizes the binary product lemma in Chapter 2 §8; it does not assert
      existence of every large product in a fixed universe.
      The coproduct comparison is derived support for the all-points groupoid
      and disjoint-union viewpoint of Chapter 2 §§5–6, not a named theorem
      quoted from the book. The fiber-finiteness, properness and finite-index
      bridge are supporting covering theory, not theorems quoted from the book.
      Semilocal simple connectivity and its transport/refinement API are
      supporting theory, not a claimed correspondence with a named book result.
      No open redistribution license is inferred for
      the author-hosted PDF, and no book excerpts or PDF assets are included.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Uses the canonical endomorphism, conjugation, one-object category,
      connectedness, fundamental-groupoid, subdivision, open-cover,
      morphism-property, pairwise-diagram and colimit APIs, together with
      covering maps, lifting, monodromy, deck groups and equivariant maps,
      as well as cardinality, local constancy, proper maps, compact projections
      and local closedness, with the orbit-stabilizer equivalence, ordinary
      left-coset quotients and subgroup finite-index API. Semilocal results use
      path-homotopy quotients, subgroup ranges, local-homeomorphism charts,
      covering-induced path-class injectivity and open path-connected
      neighborhood bases.
  - id: https://github.com/FormalFrontier/vector-bundles
    relationship: builds-on
    note: >-
      Follows the local closedness and compact-fiber proof pattern for proper
      bundle projections in VectorBundles.Topology.FiberBundle.Proper.
      This is proof-pattern reuse, not a package dependency or a replacement
      of a given covering map by a fixed-model bundle projection.
  - id: https://github.com/FormalFrontier/sphere-topology
    relationship: builds-on
    note: >-
      The generic covering formalizations originate in sphere-topology by
      Formal Frontier Agents. The modules CoveringLifting, CoveringEquivalence,
      CoveringMonodromy, DeckGroup and DeckMonodromy supply the covering APIs
      now under FundamentalGroupoids.Topology.Covering, with the same
      declaration names and retained Apache-2.0 and authorship notices.
      Its signed-period and complex-circle coordinate definitions and proofs in
      SphereTopology.Homotopy.Circle also supply the Fundamental Groupoids
      circle module, with the same public names and characteristic API.
automation:
  methods:
    - method: agent
      framework: Formal Frontier agents and Lean 4
      tool_setup: AI-assisted Lean formalization and mathematical documentation.
status:
  scope: >-
    In an arbitrary category, equality of isomorphism-induced endomorphism
    transports is characterized by centrality of the relative loop.
    In a groupoid, independence from every isomorphism to a fixed explicitly
    isomorphic target characterizes commutativity. A chosen vertex functor is
    full and faithful in any category and an equivalence in a preconnected
    groupoid. Path connectedness agrees with connectedness of the fundamental
    groupoid, including nonemptiness. Small-path generation needs only
    composition stability, and local naturality extends to a unique natural
    transformation. Strictly compatible chart functors descend uniquely by
    equality; characteristic object and morphism equations include equality
    transport. Space, index, target-object and target-hom universes are
    independent. Inclusion cocones are colimits in Grpd and Cat at their
    fixed bundled sizes. No connectedness, inhabited intersections,
    nonempty target or faithful inclusion is required for descent.
    For X : Type u, two opens U and V with U ⊔ V = ⊤, set path connectedness
    of U, V and their intersection, and a common point p, compatible
    homomorphisms from the two based fundamental groups into any G : Type v
    with Group G extend uniquely to the fundamental group of X at p.
    The extension satisfies both inclusion-composition equations; u and v are
    independent. The same four inclusion homomorphisms form an IsPushout
    square in GrpCat.{u}. These are two-open specializations of the based-group
    colimit theorem, obtained using strict groupoid descent. Neither global
    path connectedness nor local path connectedness is an extra hypothesis.
    For an inclusion-directed open cover by neighborhoods of a supplied basepoint,
    compatible homomorphisms from local fundamental groups into any monoid extend
    uniquely to the ambient fundamental group. Space, index and target universes
    are independent. The existing inclusion cocone is a colimit in GrpCat.{u};
    repeated indices are retained, with no path connectedness, intersection closure,
    separation, local connectivity, finiteness or separate index nonemptiness premise.
    This version uses every inclusion between presented neighborhoods and the
    diagram inducedFunctor U ⋙ openNhdsFunctor p. For arbitrary topological
    X : Type u, a supplied p : X, J : Type v with Preorder J and IsDirectedOrder J,
    and a monotone open-neighborhood cover U with hU : Monotone U, compatibility
    only along i ≤ j suffices. Homomorphisms into any G : Type w with Monoid G
    extend uniquely along the canonical inclusion legs, with u, v and w independent.
    The noncomputable definition isColimitOfIsOpenCoverOfMonotone returns
    IsColimit ((openNhdsCocone p).whisker hU.functor) in GrpCat.{u} for the
    canonical preorder category on J, not the induced all-inclusions category.
    No path connectedness, intersection closure, separation, local connectivity,
    smallness, injectivity, order reflection or separate Nonempty J premise is
    required; the cover at p supplies an index. These forms generalize the compact
    finite-stage colimit step in May, Chapter 2, §7, printed p. 19 (PDF p. 27).
    No arbitrary-cover based-group theorem, wedge calculation or
    covering-space classification is asserted.
    The fundamental-group functor on based spaces preserves every existing
    indexed product, including the empty product, without index-smallness or
    connectedness. Space and index universes are independent. The stock product
    comparison has the projection-induced coordinate maps; under the canonical
    based-product identification its coordinate homomorphism is piMulEquiv.
    The raw realization lives in the larger ambient universe when necessary,
    separately from the unrestricted preservation statement.
    For every nonzero real period T, the fundamental group of AddCircle T at
    zero is multiplicatively equivalent to Multiplicative ℤ, sending the loop
    lifted from zero to T * n to n for all integers. The complex-circle coordinate
    at one is transported through the period-one homeomorphism and sends the
    counterclockwise full turn to positive one. Inverse-loop, lifted-endpoint,
    nonidentity and signed-period homeomorphism-compatibility laws are public.
    At zero period all prescribed loops are constant; no integer equivalence
    is asserted there. The coordinate module depends only on Mathlib.
    For a continuous map with path-connected, locally path-connected domain
    and a prescribed lift of its basepoint, unique based lifting is equivalent
    to containment of fundamental-group images, compared by the basepoint
    equality. Equal based images for two covers of a fixed base give a
    homeomorphism over that base when both total spaces are path connected
    and the source is locally path connected; no base connectedness or global
    surjectivity is required for these results.
    For a covering map p between arbitrary topological spaces in independent
    universes, IsProperMap p is equivalent to finiteness of every canonical
    point-fiber subtype. No separation, local compactness, connectedness,
    surjectivity, nonempty fiber or uniform-degree assumption is required.
    The predicate of canonical fiber finiteness is locally constant and its
    locus is clopen, including empty fibers and excluding infinite ones.
    On a preconnected base, properness is equivalent to finiteness at a
    given point; no additional nonemptiness premise is required.
    On a preconnected total space with a supplied point, properness is equivalent
    to finiteness over its image, without base connectedness or surjectivity.
    If the total space is path connected, the ordinary fiber is equivariantly
    equivalent to left cosets of the canonical based fundamental-group image;
    the coset of g maps to monodromy by g. The image need not be normal, and
    the group and fiber may lie in independent universes. Properness is then
    equivalent to finite index of that exact image subgroup.
    Compact inverse images then use Mathlib's existing proper-map API.
    Monodromy fixes a fiber point exactly on its based total-space
    fundamental-group image, and two fiber points share an orbit exactly when
    joined by a path, without connectivity or local path connectedness.
    Over a path-connected base, the total space is path connected exactly
    when it is nonempty and monodromy is pretransitive.
    Continuous over-maps restrict to equivariant fiber maps without connectivity
    hypotheses. Restriction is an equivalence of map spaces for path-connected
    base and locally path-connected source, including empty or disconnected
    source; alternatively, a path-connected, locally path-connected source and
    a supplied point suffice without base connectedness. Neither comparison
    requires connectivity or local path connectedness of the target, and
    individual fiber maps need not be bijective.
    The deck group acts on every point fiber. For a separated, locally
    injective map with preconnected total space, evaluation at a supplied point
    is injective. No codomain topology is needed, and surjectivity of evaluation
    is not asserted. Deck restriction to a chosen fiber is a homomorphism into the monodromy
    centralizer in that fiber's permutation group. It is injective over a
    path-connected base, without local path connectedness, and a multiplicative
    equivalence if the total space is also locally path connected, allowing
    empty or disconnected total spaces. The occupied-fiber equivalence instead
    needs path-connected, locally path-connected total space and a supplied
    point, without base connectedness. A point stabilizer is not generally
    the monodromy permutation kernel, and the centralizer is not a group
    structure on the fiber.
    For arbitrary independent universes, the canonical functor from the stock
    categorical sigma of the original fundamental groupoids to the fundamental
    groupoid of the original topological sigma is constructed by Sigma.desc
    of the inclusion-induced maps. Object and component-arrow equations,
    the restriction natural isomorphism and carrier-level object bijectivity
    are proved. No connectedness, nonemptiness, local path connectedness,
    finiteness, separation, compact-generation or basepoint assumptions are
    imposed on the summands. The ordinary theorem sigmaComparison_isEquivalence
    follows from full faithfulness on the original path-homotopy quotients and
    object surjectivity. Mathlib's connected-source sigma factorization applies
    to the interval and its square, with endpoint and relative-boundary equations
    recovered using injectivity of the summand inclusion. The theorem is not
    registered as an instance; Mathlib's Functor.asEquivalence supplies equivalence
    data after installing it locally. No coproduct naturality theorem is asserted.
    Semilocal simple connectivity at x means that x has an open neighborhood
    whose loops based at x are nullhomotopic in the ambient space, not necessarily
    in that neighborhood. The global Prop class quantifies separately over all
    centers, including vacuously on an empty space. It is equivalent to an open
    neighborhood inclusion having trivial based fundamental-group image, without
    connectedness of that neighborhood. Simply connected spaces satisfy it
    without local path connectedness. A continuous map reflects the pointwise
    property when its induced based fundamental-group homomorphism is injective;
    injectivity of the underlying map is not assumed. Local homeomorphisms
    preserve the pointwise property. A covering derives the required induced-map
    injectivity, giving pointwise equivalence and base-to-total global transport
    without surjectivity; global descent and global equivalence need surjectivity.
    Surjective local homeomorphisms also descend the global property.
    Under local path connectedness only, the chosen neighborhood can be open
    and path connected, with ambient nullhomotopies for loops at every basepoint
    in that one neighborhood. Intrinsic simple connectivity is not asserted.
    Source and target universes are independent; no separation, base path
    connectedness, extra nonemptiness or smallness assumption is imposed.
